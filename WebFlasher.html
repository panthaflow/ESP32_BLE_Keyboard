<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Web Flasher & Terminal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #0066cc; }
        
        .status-box { background: #eef5fc; border-left: 4px solid #0066cc; padding: 12px; margin: 15px 0; border-radius: 0 4px 4px 0; font-size: 14px; }
        .progress-bar-container { width: 100%; background-color: #ddd; border-radius: 4px; overflow: hidden; height: 16px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 100%; background-color: #4CAF50; transition: width 0.2s; }
        
        button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
        #connectBtn { background-color: #0066cc; color: white; }
        #flashBtn { background-color: #4CAF50; color: white; }
        #flashBtn:disabled, #connectBtn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #console { background: #1e1e1e; color: #00ff66; font-family: 'Courier New', Courier, monospace; font-size: 13px; height: 250px; overflow-y: auto; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; margin-top: 10px; }
        
        footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; }
        footer a { color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ ESP32-S3 Web Flasher</h2>
        <p>Flashe die neueste Firmware direkt aus dem Browser auf deinen ESP32-S3, ohne Dateien herunterzuladen.</p>
        
        <div class="status-box">
            <strong>Gefundenes Release:</strong> <span id="releaseInfo">Suche nach neuem Release...</span><br>
            <strong>Gefundene Datei:</strong> <span id="fileInfo">-</span>
        </div>

        <div>
            <button id="connectBtn" disabled>1. ESP32 Verbinden</button>
            <button id="flashBtn" disabled>2. Flashen (0x0000)</button>
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="card">
        <h3>💻 Serieller Monitor (Terminal)</h3>
        <div id="console">Lade Web Flasher...</div>
    </div>

    <footer>
        <a href="https://github.com/panthaflow/ESP32_BLE_Keyboard" target="_blank">ESP32_BLE_Keyboard auf GitHub</a>
    </footer>

    <script type="module">
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.4.3/bundle.js";

        const REPO = "panthaflow/ESP32_BLE_Keyboard";
        
        const connectBtn = document.getElementById('connectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const releaseInfo = document.getElementById('releaseInfo');
        const fileInfo = document.getElementById('fileInfo');
        const consoleDiv = document.getElementById('console');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let device = null;
        let transport = null;
        let esploader = null;
        let fileBinaryData = null;

        function log(text) {
            consoleDiv.innerText += text + "\n";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        consoleDiv.innerText = "";

        async function fetchLatestRelease() {
            try {
                log("🔍 Suche auf GitHub nach dem neuesten Release...");
                const response = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
                
                if (!response.ok) throw new Error("Release API konnte nicht abgefragt werden.");
                
                const data = await response.json();
                const releaseName = data.name || data.tag_name;
                releaseInfo.innerText = releaseName;

                const mergedAsset = data.assets.find(a => a.name.endsWith("merged.bin"));

                if (!mergedAsset) {
                    fileInfo.innerText = "❌ Keine 'merged.bin' im Release gefunden!";
                    log("❌ Fehler: Kein Asset mit Endung 'merged.bin' im Release gefunden.");
                    return;
                }

                fileInfo.innerText = `${mergedAsset.name} (${(mergedAsset.size / 1024 / 1024).toFixed(2)} MB)`;
                log(`📥 Lade Firmware: ${mergedAsset.name}...`);

                // CORS-sicherer Download über GitHub API Endpoint
                const binResponse = await fetch(mergedAsset.url, {
                    headers: { 'Accept': 'application/octet-stream' }
                });

                if (!binResponse.ok) {
                    // Fallback falls API Octet-Stream fehlschlägt
                    const rawResponse = await fetch(mergedAsset.browser_download_url);
                    if (!rawResponse.ok) throw new Error("Datei-Download blockiert (CORS).");
                    const blob = await rawResponse.blob();
                    fileBinaryData = await blob.arrayBuffer();
                } else {
                    fileBinaryData = await binResponse.arrayBuffer();
                }

                log("✅ Firmware erfolgreich geladen! Bereit zum Verbinden.");
                connectBtn.disabled = false;

            } catch (err) {
                console.error(err);
                log("❌ Fehler beim Laden der Firmware-Datei: " + err.message);
                fileInfo.innerText += " (Download-Fehler)";
            }
        }

        connectBtn.addEventListener('click', async () => {
            if (navigator.serial === undefined) {
                alert("Dein Browser unterstützt kein Web Serial! Bitte benutze Google Chrome, Microsoft Edge oder Opera.");
                return;
            }

            try {
                device = await navigator.serial.requestPort();
                transport = new Transport(device);
                
                log("🔌 Verbinde mit dem seriellen Port...");
                esploader = new ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => { consoleDiv.innerText = ""; },
                        writeLine: (data) => log(data),
                        write: (data) => log(data)
                    }
                });

                await esploader.main();
                log("✅ Erfolgreich mit dem ESP32 verbunden!");
                
                flashBtn.disabled = false;
                connectBtn.disabled = true;

            } catch (err) {
                console.error(err);
                log("❌ Verbindung abgebrochen: " + err.message);
            }
        });

        flashBtn.addEventListener('click', async () => {
            if (!fileBinaryData || !esploader) return;

            try {
                flashBtn.disabled = true;
                progressContainer.style.display = "block";
                progressBar.style.width = "0%";
                
                log("🚀 Starte Flash-Vorgang (Offset 0x0000)...");

                // Konvertierung in Binärstring für esptool-js
                const bytes = new Uint8Array(fileBinaryData);
                let binaryString = "";
                for (let i = 0; i < bytes.byteLength; i++) {
                    binaryString += String.fromCharCode(bytes[i]);
                }

                const fileArray = [{
                    data: binaryString,
                    address: 0x0000
                }];

                await esploader.writeFlash({
                    fileArray: fileArray,
                    flashSize: "keep",
                    eraseAll: false,
                    compress: true,
                    reportProgress: (fileIdx, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        progressBar.style.width = percent + "%";
                    }
                });

                log("\n🎉 Flash-Vorgang ERFOLGREICH abgeschlossen!");
                log("🔄 Der ESP32 wird neu gestartet...");
                
                await esploader.hardReset();
                
            } catch (err) {
                console.error(err);
                log("\n❌ Fehler beim Flashen: " + err.message);
            } finally {
                flashBtn.disabled = false;
            }
        });

        fetchLatestRelease();
    </script>
</body>
</html>
