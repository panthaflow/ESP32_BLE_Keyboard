<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Web Flasher & Terminal</title>

    <!-- Node.js Buffer Polyfill - ZWINGEND vor esptool-js laden -->
    <script src="https://bundle.run/buffer@6.0.3"></script>
    <script>
        // Globales Buffer-Objekt für den Browser bereitstellen
        if (typeof window.buffer !== 'undefined') {
            window.Buffer = window.buffer.Buffer;
        }
    </script>

    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { margin: 0; color: #0066cc; }
        .lang-select { padding: 5px 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; }

        .status-box { background: #eef5fc; border-left: 4px solid #0066cc; padding: 12px; margin: 15px 0; border-radius: 0 4px 4px 0; font-size: 14px; }
        .version-select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
        
        .progress-bar-container { width: 100%; background-color: #ddd; border-radius: 4px; overflow: hidden; height: 16px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 100%; background-color: #4CAF50; transition: width 0.2s; }
        
        button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
        #connectBtn { background-color: #0066cc; color: white; }
        #flashBtn { background-color: #4CAF50; color: white; }
        #flashBtn:disabled, #connectBtn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #console { background: #1e1e1e; color: #00ff66; font-family: 'Courier New', Courier, monospace; font-size: 13px; height: 250px; overflow-y: auto; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; margin-top: 10px; }
        
        footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; }
        footer a { color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-container">
            <h2>⚡ ESP32-S3 Web Flasher</h2>
            <select id="langSelect" class="lang-select">
                <option value="de">🇩🇪 DE</option>
                <option value="en">🇬🇧 EN</option>
            </select>
        </div>
        <p data-i18n="subtitle">Flashe die Firmware direkt aus dem Browser auf deinen ESP32-S3. Standardmäßig ist die neueste Version gewählt.</p>
        
        <div class="status-box">
            <label for="releaseSelect"><strong data-i18n="labelSelectedRelease">Gewähltes Release:</strong></label>
            <select id="releaseSelect" class="version-select">
                <option value="" data-i18n="optLoadingReleases">Lade verfügbare Firmware-Dateien...</option>
            </select>
            <strong data-i18n="labelFoundFile">Gefundene Datei:</strong> <span id="fileInfo" data-i18n="infoLoadingFirmware">Lade Firmware-Informationen...</span>
        </div>

        <div>
            <button id="connectBtn" data-i18n="btnConnect" disabled>1. ESP32 Verbinden</button>
            <button id="flashBtn" data-i18n="btnFlash" disabled>2. Flashen (0x0000)</button>
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="card">
        <h3 data-i18n="terminalTitle">💻 Serieller Monitor (Terminal)</h3>
        <div id="console">Lade Web Flasher...</div>
    </div>

    <footer>
        <a href="https://github.com/panthaflow/ESP32_BLE_Keyboard" target="_blank" data-i18n="footerRepo">ESP32_BLE_Keyboard auf GitHub</a>
    </footer>

    <script type="module">
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.4.3/bundle.js";

        const REPO = "panthaflow/ESP32_BLE_Keyboard";
        const FIRMWARE_DIR = "firmware";
        
        const i18n = {
            de: {
                subtitle: "Flashe die Firmware direkt aus dem Browser auf deinen ESP32-S3. Standardmäßig ist die neueste Version gewählt.",
                labelSelectedRelease: "Gewähltes Release:",
                optLoadingReleases: "Lade verfügbare Firmware-Dateien...",
                labelFoundFile: "Gefundene Datei:",
                infoLoadingFirmware: "Lade Firmware-Informationen...",
                btnConnect: "1. ESP32 Verbinden",
                btnFlash: "2. Flashen (0x0000)",
                terminalTitle: "💻 Serieller Monitor (Terminal)",
                footerRepo: "ESP32_BLE_Keyboard auf GitHub",
                latestBadge: "(Neueste / Latest)",
                logSearching: "🔍 Suche im Ordner 'firmware/' nach Firmware-Dateien...",
                logNoFiles: "❌ Fehler: Keine .merged.bin Dateien im Ordner 'firmware/' gefunden.",
                logLoadingFile: "📥 Lade Firmware: ",
                logDirectLoaded: "✅ Firmware {file} erfolgreich geladen! Bereit zum Verbinden.",
                logLoadFailed: "❌ Fehler beim Laden der Datei: ",
                logConnecting: "🔌 Verbinde mit dem seriellen Port...",
                logConnected: "✅ Erfolgreich mit dem ESP32 verbunden!",
                logConnError: "❌ Verbindung abgebrochen / Fehler: ",
                logClosingPort: "🔄 Schließe seriellen Port...",
                logStartingFlash: "🚀 Starte Flash-Vorgang (Offset 0x0000)...",
                logFlashSuccess: "\n🎉 Flash-Vorgang ERFOLGREICH abgeschlossen!",
                logRestarting: "🔄 Der ESP32 wird neu gestartet...",
                logFlashError: "\n❌ Fehler beim Flashen: ",
                errNoWebSerial: "Dein Browser unterstützt kein Web Serial! Bitte benutze Google Chrome, Microsoft Edge oder Opera."
            },
            en: {
                subtitle: "Flash the firmware directly from your browser to your ESP32-S3. The latest version is selected by default.",
                labelSelectedRelease: "Selected Release:",
                optLoadingReleases: "Loading available firmware files...",
                labelFoundFile: "Found file:",
                infoLoadingFirmware: "Loading firmware details...",
                btnConnect: "1. Connect ESP32",
                btnFlash: "2. Flash (0x0000)",
                terminalTitle: "💻 Serial Monitor (Terminal)",
                footerRepo: "ESP32_BLE_Keyboard on GitHub",
                latestBadge: "(Latest)",
                logSearching: "🔍 Searching 'firmware/' directory for firmware files...",
                logNoFiles: "❌ Error: No .merged.bin files found in 'firmware/' directory.",
                logLoadingFile: "📥 Downloading firmware: ",
                logDirectLoaded: "✅ Firmware {file} successfully loaded! Ready to connect.",
                logLoadFailed: "❌ Error loading file: ",
                logConnecting: "🔌 Connecting to serial port...",
                logConnected: "✅ Successfully connected to ESP32!",
                logConnError: "❌ Connection aborted / Error: ",
                logClosingPort: "🔄 Closing serial port...",
                logStartingFlash: "🚀 Starting flash process (Offset 0x0000)...",
                logFlashSuccess: "\n🎉 Flashing process COMPLETED SUCCESSFULLY!",
                logRestarting: "🔄 Restarting ESP32...",
                logFlashError: "\n❌ Error while flashing: ",
                errNoWebSerial: "Your browser does not support Web Serial! Please use Google Chrome, Microsoft Edge, or Opera."
            }
        };

        let currentLang = localStorage.getItem('appLang') || 'de';

        const langSelect = document.getElementById('langSelect');
        const releaseSelect = document.getElementById('releaseSelect');
        const connectBtn = document.getElementById('connectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const fileInfo = document.getElementById('fileInfo');
        const consoleDiv = document.getElementById('console');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let device = null;
        let transport = null;
        let esploader = null;
        let fileBinaryData = null;
        let firmwareFiles = [];

        function updateLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('appLang', lang);
            langSelect.value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
            });
        }

        function log(text) {
            consoleDiv.innerText += text + "\n";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        async function disconnectPort() {
            try {
                if (transport) {
                    await transport.disconnect();
                    transport = null;
                }
                if (device) {
                    await device.close();
                    device = null;
                }
            } catch (e) {
                console.warn("Error closing port:", e);
            }
            esploader = null;
            connectBtn.disabled = !fileBinaryData;
            flashBtn.disabled = true;
        }

        consoleDiv.innerText = "";

        async function fetchFirmwareFolder() {
            try {
                log(i18n[currentLang].logSearching);
                const response = await fetch(`https://api.github.com/repos/${REPO}/contents/${FIRMWARE_DIR}`);
                
                if (!response.ok) throw new Error("Could not fetch contents of 'firmware' folder.");
                
                const files = await response.json();
                firmwareFiles = files.filter(f => f.name.endsWith(".merged.bin"));

                if (firmwareFiles.length === 0) {
                    log(i18n[currentLang].logNoFiles);
                    fileInfo.innerText = "Keine Dateien gefunden";
                    return;
                }

                firmwareFiles.sort((a, b) => b.name.localeCompare(a.name));

                releaseSelect.innerHTML = "";
                firmwareFiles.forEach((file, index) => {
                    const option = document.createElement('option');
                    option.value = file.name;
                    
                    const verMatch = file.name.match(/v\d+\.\d+\.\d+/);
                    const label = verMatch ? verMatch[0] : file.name;
                    
                    option.textContent = `${label} (${file.name}) ${index === 0 ? i18n[currentLang].latestBadge : ''}`;
                    releaseSelect.appendChild(option);
                });

                loadFirmwareFile(firmwareFiles[0].name);

            } catch (err) {
                console.error(err);
                log("❌ Fehler: " + err.message);
                fileInfo.innerText = "Fehler beim Laden";
            }
        }

        async function loadFirmwareFile(fileName) {
            connectBtn.disabled = true;
            flashBtn.disabled = true;
            fileBinaryData = null;
            
            const filePath = `${FIRMWARE_DIR}/${fileName}`;
            fileInfo.innerText = `${fileName} - Loading...`;
            log(i18n[currentLang].logLoadingFile + filePath + "...");

            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error(`HTTP Status ${res.status}`);

                fileBinaryData = await res.arrayBuffer();
                fileInfo.innerText = `${fileName} (${(fileBinaryData.byteLength / 1024 / 1024).toFixed(2)} MB)`;
                
                const loadedMsg = i18n[currentLang].logDirectLoaded.replace('{file}', fileName);
                log(loadedMsg);
                connectBtn.disabled = false;

            } catch (err) {
                console.error(err);
                log(i18n[currentLang].logLoadFailed + err.message);
                fileInfo.innerText = "Download Error";
            }
        }

        langSelect.addEventListener('change', (e) => {
            updateLanguage(e.target.value);
            const firstOption = releaseSelect.options[0];
            if (firstOption && firmwareFiles[0]) {
                const file = firmwareFiles[0];
                const verMatch = file.name.match(/v\d+\.\d+\.\d+/);
                const label = verMatch ? verMatch[0] : file.name;
                firstOption.textContent = `${label} (${file.name}) ${i18n[currentLang].latestBadge}`;
            }
        });

        releaseSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                loadFirmwareFile(e.target.value);
            }
        });

        connectBtn.addEventListener('click', async () => {
            if (navigator.serial === undefined) {
                alert(i18n[currentLang].errNoWebSerial);
                return;
            }

            await disconnectPort();

            try {
                device = await navigator.serial.requestPort();
                transport = new Transport(device);
                
                log(i18n[currentLang].logConnecting);
                esploader = new ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => { consoleDiv.innerText = ""; },
                        writeLine: (data) => log(data),
                        write: (data) => log(data)
                    }
                });

                await esploader.main();
                log(i18n[currentLang].logConnected);
                
                flashBtn.disabled = false;
                connectBtn.disabled = true;

            } catch (err) {
                console.error(err);
                log(i18n[currentLang].logConnError + err.message);
                log(i18n[currentLang].logClosingPort);
                await disconnectPort();
            }
        });

        flashBtn.addEventListener('click', async () => {
            if (!fileBinaryData || !esploader) return;

            try {
                flashBtn.disabled = true;
                progressContainer.style.display = "block";
                progressBar.style.width = "0%";
                
                log(i18n[currentLang].logStartingFlash);

                // Sichere Binary-Konvertierung
                let binaryString = "";
                const bytes = new Uint8Array(fileBinaryData);
                const chunkSize = 0x8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    binaryString += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                }

                const fileArray = [{
                    data: binaryString,
                    address: 0x0000
                }];

                await esploader.writeFlash({
                    fileArray: fileArray,
                    flashSize: "keep",
                    eraseAll: false,
                    compress: true,
                    reportProgress: (fileIdx, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        progressBar.style.width = percent + "%";
                    }
                });

                log(i18n[currentLang].logFlashSuccess);
                log(i18n[currentLang].logRestarting);
                
                await esploader.hardReset();
                
            } catch (err) {
                console.error(err);
                log(i18n[currentLang].logFlashError + err.message);
            } finally {
                log(i18n[currentLang].logClosingPort);
                await disconnectPort();
            }
        });

        updateLanguage(currentLang);
        fetchFirmwareFolder();
    </script>
</body>
</html>
