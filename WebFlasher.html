<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 Web Flasher & Terminal</title>
    <!-- Node.js Buffer Polyfill für Browser-Kompatibilität von esptool-js -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
        if (typeof window.buffer !== 'undefined') {
            window.Buffer = window.buffer.Buffer;
        }
    </script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 20px auto; padding: 20px; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #0066cc; }
        
        .status-box { background: #eef5fc; border-left: 4px solid #0066cc; padding: 12px; margin: 15px 0; border-radius: 0 4px 4px 0; font-size: 14px; }
        .version-select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; }
        
        .progress-bar-container { width: 100%; background-color: #ddd; border-radius: 4px; overflow: hidden; height: 16px; margin-top: 10px; display: none; }
        .progress-bar { width: 0%; height: 100%; background-color: #4CAF50; transition: width 0.2s; }
        
        button { padding: 12px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; margin-bottom: 10px; }
        #connectBtn { background-color: #0066cc; color: white; }
        #flashBtn { background-color: #4CAF50; color: white; }
        #flashBtn:disabled, #connectBtn:disabled { background-color: #cccccc; cursor: not-allowed; }
        
        #console { background: #1e1e1e; color: #00ff66; font-family: 'Courier New', Courier, monospace; font-size: 13px; height: 250px; overflow-y: auto; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; margin-top: 10px; }
        
        footer { text-align: center; font-size: 12px; color: #666; margin-top: 20px; }
        footer a { color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ ESP32-S3 Web Flasher</h2>
        <p>Flashe die Firmware direkt aus dem Browser auf deinen ESP32-S3. Standardmäßig ist die neueste Version gewählt.</p>
        
        <div class="status-box">
            <label for="releaseSelect"><strong>Gewähltes Release:</strong></label>
            <select id="releaseSelect" class="version-select">
                <option value="">Lade verfügbare Releases...</option>
            </select>
            <strong>Gefundene Datei:</strong> <span id="fileInfo">Lade Firmware-Informationen...</span>
        </div>

        <div>
            <button id="connectBtn" disabled>1. ESP32 Verbinden</button>
            <button id="flashBtn" disabled>2. Flashen (0x0000)</button>
        </div>

        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="card">
        <h3>💻 Serieller Monitor (Terminal)</h3>
        <div id="console">Lade Web Flasher...</div>
    </div>

    <footer>
        <a href="https://github.com/panthaflow/ESP32_BLE_Keyboard" target="_blank">ESP32_BLE_Keyboard auf GitHub</a>
    </footer>

    <script type="module">
        import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.4.3/bundle.js";

        const REPO = "panthaflow/ESP32_BLE_Keyboard";
        const LOCAL_FIRMWARE_PATH = "ESP32_Keyboard_v1.0.1.ino.merged.bin";
        
        const releaseSelect = document.getElementById('releaseSelect');
        const connectBtn = document.getElementById('connectBtn');
        const flashBtn = document.getElementById('flashBtn');
        const fileInfo = document.getElementById('fileInfo');
        const consoleDiv = document.getElementById('console');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let device = null;
        let transport = null;
        let esploader = null;
        let fileBinaryData = null;
        let releasesMap = {};

        function log(text) {
            consoleDiv.innerText += text + "\n";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        async function disconnectPort() {
            try {
                if (transport) {
                    await transport.disconnect();
                    transport = null;
                }
                if (device) {
                    await device.close();
                    device = null;
                }
            } catch (e) {
                console.warn("Fehler beim Schließen des Ports:", e);
            }
            esploader = null;
            connectBtn.disabled = !fileBinaryData;
            flashBtn.disabled = true;
        }

        consoleDiv.innerText = "";

        // Alle Releases von GitHub laden und im Dropdown anzeigen
        async function fetchAllReleases() {
            try {
                log("🔍 Suche auf GitHub nach verfügbaren Releases...");
                const response = await fetch(`https://api.github.com/repos/${REPO}/releases`);
                
                if (!response.ok) throw new Error("Release API nicht erreichbar.");
                
                const releases = await response.json();
                if (!releases || releases.length === 0) throw new Error("Keine Releases im Repo gefunden.");

                releaseSelect.innerHTML = "";
                releasesMap = {};

                releases.forEach((rel, index) => {
                    const mergedAsset = rel.assets.find(a => a.name.endsWith("merged.bin"));
                    if (mergedAsset) {
                        const option = document.createElement('option');
                        option.value = rel.tag_name;
                        // Neueste Version markieren
                        option.textContent = `${rel.name || rel.tag_name} ${index === 0 ? '(Neueste / Latest)' : ''}`;
                        releaseSelect.appendChild(option);
                        
                        releasesMap[rel.tag_name] = mergedAsset;
                    }
                });

                if (Object.keys(releasesMap).length === 0) {
                    throw new Error("Keine 'merged.bin' Dateien in den Releases gefunden.");
                }

                // Standardmäßig das neueste Release laden
                const latestTag = releaseSelect.value;
                loadSelectedFirmware(latestTag);

            } catch (err) {
                console.error(err);
                log("ℹ️ Versuche lokale Firmware zu laden...");
                tryFetchLocalFirmware();
            }
        }

        async function tryFetchLocalFirmware() {
            try {
                const localRes = await fetch(LOCAL_FIRMWARE_PATH);
                if (localRes.ok) {
                    fileBinaryData = await localRes.arrayBuffer();
                    releaseSelect.innerHTML = `<option>v1.0.1 (Direktes Host-Release)</option>`;
                    fileInfo.innerText = `${LOCAL_FIRMWARE_PATH} (${(fileBinaryData.byteLength / 1024 / 1024).toFixed(2)} MB)`;
                    log("✅ Firmware direkt vom Host geladen!");
                    connectBtn.disabled = false;
                } else {
                    throw new Error("Lokale Firmware nicht gefunden.");
                }
            } catch(e) {
                log("❌ Fehler: Keine Firmware konnte geladen werden.");
                fileInfo.innerText = "Download-Fehler";
            }
        }

        async function loadSelectedFirmware(tagName) {
            const asset = releasesMap[tagName];
            if (!asset) return;

            connectBtn.disabled = true;
            flashBtn.disabled = true;
            fileBinaryData = null;
            fileInfo.innerText = `${asset.name} (${(asset.size / 1024 / 1024).toFixed(2)} MB) - Lade...`;
            log(`📥 Lade Firmware für Version ${tagName}: ${asset.name}...`);

            try {
                const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(asset.browser_download_url)}`;
                const binResponse = await fetch(proxyUrl);
                
                if (!binResponse.ok) throw new Error("Download über Proxy fehlgeschlagen.");

                fileBinaryData = await binResponse.arrayBuffer();
                fileInfo.innerText = `${asset.name} (${(fileBinaryData.byteLength / 1024 / 1024).toFixed(2)} MB)`;
                log(`✅ Firmware (${tagName}) erfolgreich geladen! Bereit zum Verbinden.`);
                connectBtn.disabled = false;

            } catch (err) {
                console.error(err);
                log("❌ Fehler beim Laden der Version " + tagName + ": " + err.message);
                fileInfo.innerText = "Download-Fehler (CORS)";
            }
        }

        releaseSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                loadSelectedFirmware(e.target.value);
            }
        });

        connectBtn.addEventListener('click', async () => {
            if (navigator.serial === undefined) {
                alert("Dein Browser unterstützt kein Web Serial! Bitte benutze Google Chrome, Microsoft Edge oder Opera.");
                return;
            }

            await disconnectPort();

            try {
                device = await navigator.serial.requestPort();
                transport = new Transport(device);
                
                log("🔌 Verbinde mit dem seriellen Port...");
                esploader = new ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: {
                        clean: () => { consoleDiv.innerText = ""; },
                        writeLine: (data) => log(data),
                        write: (data) => log(data)
                    }
                });

                await esploader.main();
                log("✅ Erfolgreich mit dem ESP32 verbunden!");
                
                flashBtn.disabled = false;
                connectBtn.disabled = true;

            } catch (err) {
                console.error(err);
                log("❌ Verbindung abgebrochen / Fehler: " + err.message);
                log("🔄 Schließe seriellen Port...");
                await disconnectPort();
            }
        });

        flashBtn.addEventListener('click', async () => {
            if (!fileBinaryData || !esploader) return;

            try {
                flashBtn.disabled = true;
                progressContainer.style.display = "block";
                progressBar.style.width = "0%";
                
                log("🚀 Starte Flash-Vorgang (Offset 0x0000)...");

                const bytes = new Uint8Array(fileBinaryData);
                let binaryString = "";
                const chunkSize = 0x8000;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    binaryString += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                }

                const fileArray = [{
                    data: binaryString,
                    address: 0x0000
                }];

                await esploader.writeFlash({
                    fileArray: fileArray,
                    flashSize: "keep",
                    eraseAll: false,
                    compress: true,
                    reportProgress: (fileIdx, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        progressBar.style.width = percent + "%";
                    }
                });

                log("\n🎉 Flash-Vorgang ERFOLGREICH abgeschlossen!");
                log("🔄 Der ESP32 wird neu gestartet...");
                
                await esploader.hardReset();
                
            } catch (err) {
                console.error(err);
                log("\n❌ Fehler beim Flashen: " + err.message);
            } finally {
                log("🔌 Schließe seriellen Port...");
                await disconnectPort();
            }
        });

        fetchAllReleases();
    </script>
</body>
</html>
